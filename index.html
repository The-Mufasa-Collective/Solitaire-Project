<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
    <title>Solitaire by The Mufasa Collective</title>
</head>
<body>
  <div id="game">

    <div id="top-bar">
      <div class="info">Time <span id="timer">00:00</span></div>
      <div class="info recent-score">
        <div>Most Recent Game's Time</div>
        <span id="score">00:00</span>
      </div>
      <div class="info recent-score">
        <div>Best Time</div>
        <span id="best-time">--:--</span>
      </div>
    </div>

    <!-- the foundations -->
    <div id="piles">
      <div id="stock" class="pile">
      </div>
      <div id="waste" class="pile">
      </div>

      <div class="spacer"></div>

      <div class="pile foundation black" data-suit="clubs">♣</div>
      <div class="pile foundation black" data-suit="spades">♠</div>
      <div class="pile foundation red" data-suit="diamonds">♦</div>
      <div class="pile foundation red" data-suit="hearts">♥</div>
    </div>

    <!-- The tableu -->
    <div id="columns">
      <div class="column" id="column1">
        <div class="empty-column"></div>
      </div>
      <div class="column" id="column2">
        <div class="empty-column"></div>
      </div>
      <div class="column" id="column3">
        <div class="empty-column"></div>
      </div>
      <div class="column" id="column4">
        <div class="empty-column"></div>
      </div>
      <div class="column" id="column5">
        <div class="empty-column"></div>
      </div>
      <div class="column" id="column6">
       <div class="empty-column"></div>
      </div>
      <div class="column" id="column7">
        <div class="empty-column"></div>
      </div>
    </div>

    <p id="message"></p>

    <div id="buttons">
      <button id="restart">New Game</button>
      <button id="hint">Instructions</button>
    </div>

<!----------------------------------->
<!-- Instructions Pop-up Panel -->
    <div id="instructions-modal" class="modal hidden">
      <div class="instructions">
        <h1 id="content">How to play solitaire</h1>
        <ol id="content-list">
          <li>Click on a card to select it.</li>
          <li>Click on a pile to move the selected card there.</li>
          <li>Try to build sequences from Ace to King in each foundation.</li>
        </ol>
        <!-- Button to close the pop-up panel -->
        <button id="close-instructions">Close</button>
      </div>
    </div>

  </div> 
</body>
</html>
<!--------------------------------------------------->

</body>
</html>
