<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
    <title>Solitaire by The Mufasa Collective</title>
</head>
<body>
  <div id="game">

    <div id="top-bar">
      <div class="info">Time <span id="timer">00:00</span></div>
      <div class="info">Score: <span id="score">0</span></div>
    </div>

    <!-- the foundations -->
    <div id="piles">
      <div id="stock" class="pile">
        <div class="card back"></div> <!-- JS replaces it -->
      </div>
      <div id="waste" class="pile"></div>

      <div class="spacer"></div>

      <div class="pile foundation black" data-suit="♣">♣</div>
      <div class="pile foundation black" data-suit="♠">♠</div>
      <div class="pile foundation red" data-suit="♦">♦</div>
      <div class="pile foundation red" data-suit="♥">♥</div>
    </div>

    <!-- The tableu -->
    <div id="columns">
      <div class="column" id="column1">
        <div class="empty-column"></div>
        <div draggable="true" class="card tableu-card" id="spades-queen">Spades Queen</div>
      </div>
      <div class="column" id="column2">
        <div class="empty-column"></div>
      </div>
      <div class="column" id="column3">
        <div class="empty-column"></div>
        <div draggable="true" class="card tableu-card" id="diamond-king">Diamond King</div>
      </div>
      <div class="column" id="column4">
        <div class="empty-column"></div>
        <div draggable="true" class="card tableu-card" id="clubs-ten">Clubs Ten</div>
        <div draggable="true" class="card tableu-card" id="hearts-jack">Hearts Jack</div>
      </div>
      <div class="column" id="column5">
        <div class="empty-column"></div>
        <div draggable="true" class="card tableu-card" id="clubs-ten">Clubs Ten</div>
      </div>
      <div class="column" id="column6">
        <div class="empty-column"></div>
        <div draggable="true" class="card tableu-card" id="spades-queen">Spades Queen</div>
        <div draggable="true" class="card tableu-card" id="diamond-king">Diamond King</div>
      </div>
      <div class="column" id="column7">
        <div class="empty-column"></div>
      </div>
    </div>

    <p id="message"></p>

    <div id="buttons">
      <button id="restart">New Game</button>
      <button id="hint">Instructions</button>
    </div>

  </div>

</body>
</html>
