<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
    <title>Solitaire by The Mufasa Collective</title>
</head>
<body>
  <div id="game">

    <div id="top-bar">
      <div class="info">Time <span id="timer">00:00</span></div>
      <div class="info">Score: <span id="score">0</span></div>
    </div>

    <!-- the foundations -->
    <div id="piles">
      <div id="stock" class="pile">
        <div class="card back"></div> <!-- JS replaces it -->
      </div>
      <div id="waste" class="pile"></div>

      <div class="spacer"></div>

      <div class="pile foundation black" data-suit="clubs">♣</div>
      <div class="pile foundation black" data-suit="spades">♠</div>
      <div class="pile foundation red" data-suit="diamonds">♦</div>
      <div class="pile foundation red" data-suit="hearts">♥</div>
    </div>

    <!-- The tableu -->
    <div id="columns">
      <div class="column">
        <div draggable="true" class="card tableu-card" id="hearts-ace">Ace of heards</div>
      </div>     
      <div class="column">
        <div draggable="true" class="card tableu-card" id="hearts-two">Two of hearts</div>
      </div>
      <div class="column">
        <div draggable="true" class="card tableu-card" id="hearts-three">Three of hearts</div>
      </div>
      <div class="column">
        <div draggable="true" class="card tableu-card" id="clubs-ace">Ace of Clubs</div>
      </div>
      <div class="column"></div>
      <div class="column"></div>
      <div class="column"></div>
    </div>

    <p id="message"></p>

    <div id="buttons">
      <button id="restart">New Game</button>
      <button id="hint">Instructions</button>
    </div>

  </div>

</body>
</html>
